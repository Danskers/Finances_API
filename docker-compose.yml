
services:
  auth-service:
    build: ./Backend/auth-service
    container_name: auth-service
    environment:
      DATABASE_URL: sqlite:////data/finanzas1.sqlite3
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      ACCOUNT_SERVICE_URL: http://account-service:8001
    volumes:
      - ./finanzas1.sqlite3:/data/finanzas1.sqlite3
    depends_on:
      - account-service
    restart: unless-stopped

  account-service:
    build: ./Backend/account-service
    container_name: account-service
    environment:
      DATABASE_URL: sqlite:////data/finanzas1.sqlite3
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./finanzas1.sqlite3:/data/finanzas1.sqlite3
    restart: unless-stopped

  transaction-service:
    build: ./Backend/transaction-service
    container_name: transaction-service
    environment:
      DATABASE_URL: sqlite:////data/finanzas1.sqlite3
      SECRET_KEY: ${SECRET_KEY}
      ACCOUNT_SERVICE_URL: http://account-service:8001
    volumes:
      - ./finanzas1.sqlite3:/data/finanzas1.sqlite3
    depends_on:
      - account-service
    restart: unless-stopped


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  storage-service:
    build: ./Backend/storage-service
    container_name: storage-service
    environment:
      UPLOADS_DB_PATH: /app/data/uploads.db
      SECRET_KEY: ${SECRET_KEY}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-facturas}
      MAX_UPLOAD_MB: 5
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
    volumes:
    - invoice_temp:/app/temp_uploads
    - storage_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped



  celery-worker:
    build: ./Backend/storage-service
    container_name: celery-worker
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    environment:
      UPLOADS_DB_PATH: /app/data/uploads.db
      CELERY_BROKER_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-facturas}
      MAX_UPLOAD_MB: 5
    volumes:
    - invoice_temp:/app/temp_uploads
    - storage_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - account-service
      - transaction-service
      - storage-service
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  rabbitmq_data:
  invoice_temp:
  storage_data: