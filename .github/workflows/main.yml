name: CI/CD Finanzas_API

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build y pruebas
    runs-on: ubuntu-latest

    steps:
      # Descargar código
      - name: Checkout
        uses: actions/checkout@v4

      # Configurar Python
      - name: Configuración de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Verificación
      - name: Verificar código
        run: |
          pytest -v

  integration-test:
    name: Prueba de integración
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Iniciar API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          sleep 5
          cat api.log

      - name: Verificar API
        run: |
          curl --fail http://localhost:8000/docs

  deployment:
    name: Preparar despliegue
    runs-on: ubuntu-latest
    needs: integration-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estado del despliegue
        run: |
          echo "Las pruebas fueron exitosas"
          echo "La aplicación está lista para despliegue"

  
