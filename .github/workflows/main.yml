name: CI/CD Finanzas_API

on:
  push:
    branches:
      - main
      - arquitectura-microservicios

jobs:
  build-and-test-monolito:
    name: Build y pruebas (monolito)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuración de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar código
        run: |
          pytest -v

  build-and-test-account-service:
    name: Build y pruebas (account-service)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuración de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: ./Backend/account-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar que la app importa correctamente
        working-directory: ./Backend/account-service
        run: |
          python -c "from app.main import app; print('OK: account-service importa sin errores')"

  integration-test:
    name: Prueba de integración (monolito)
    runs-on: ubuntu-latest
    needs: build-and-test-monolito

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Iniciar API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          sleep 5
          cat api.log

      - name: Verificar API
        run: |
          curl --fail http://localhost:8000/docs

  integration-test-account-service:
    name: Prueba de integración (account-service)
    runs-on: ubuntu-latest
    needs: build-and-test-account-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: ./Backend/account-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Iniciar account-service
        working-directory: ./Backend/account-service
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8001 > account.log 2>&1 &
          sleep 5
          cat account.log

      - name: Verificar account-service
        run: |
          curl --fail http://localhost:8001/health

  deployment:
    name: Preparar despliegue
    runs-on: ubuntu-latest
    needs: [integration-test, integration-test-account-service]


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estado del despliegue
        run: |
          echo "Las pruebas fueron exitosas"
          echo "La aplicación está lista para despliegue"