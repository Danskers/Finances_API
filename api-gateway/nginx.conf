worker_processes 1;
pid /tmp/nginx-gateway.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    upstream monolito {
        server 127.0.0.1:8000;
    }

    upstream account_service {
        server 127.0.0.1:8001;
    }

    server {
        listen 8080;

        # Todo lo de cuentas va al account-service
        location /cuentas {
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /health-cuentas {
            proxy_pass http://account_service/health;
        }

        # Todo lo demás (login, dashboard, transacciones, /api/token) va al monolito
        location / {
            proxy_pass http://monolito;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie $http_cookie;
        }
    }
}