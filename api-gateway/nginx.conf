worker_processes 1;
pid /tmp/nginx-gateway.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    upstream auth_service {
        server auth-service:8000;
    }

    upstream account_service {
        server account-service:8001;
    }

    upstream storage_service {
        server storage-service:8002;
    }

    upstream transaction_service {
        server transaction-service:8003;
    }

    server {
        listen 8080;

        location /health {
            return 200 "API Gateway funcionando";
            add_header Content-Type text/plain;
        }

        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /cuentas {
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /health-cuentas {
            proxy_pass http://account_service/health;
        }

        location /uploads {
            proxy_pass http://storage_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /transacciones {
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /limites {
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /resumen {
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        location /balances {
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
    }
}
