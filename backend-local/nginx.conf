worker_processes 1;
pid /tmp/nginx-gateway.pid;
error_log /tmp/nginx-gateway-error.log;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    /tmp/nginx-gateway-access.log;
    client_max_body_size 6m;

    # ---------- Servicios de atrás ----------
    upstream monolito            { server 127.0.0.1:8000; }
    upstream account_service     { server 127.0.0.1:8001; }
    upstream auth_service        { server 127.0.0.1:8002; }
    upstream transaction_service { server 127.0.0.1:8003; }
    upstream storage_service     { server 127.0.0.1:8004; }

    # ---------- Punto de entrada único ----------
    server {
        listen 8080;

        # /auth/login -> auth-service:/login, /auth/register -> auth-service:/register
        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /cuentas {
            proxy_pass http://account_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Transacciones, resumen mensual, límites y balances
        location ~ ^/(transacciones|resumen|limites|balances) {
            proxy_pass http://transaction_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Facturas (storage-service)
        location /uploads {
            proxy_pass http://storage_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /health-cuentas { proxy_pass http://account_service/health; }
        location /health-auth    { proxy_pass http://auth_service/health; }

        # Todo lo demás va al monolito
        location / {
            proxy_pass http://monolito;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie $http_cookie;
        }
    }
}
